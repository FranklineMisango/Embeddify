# =============================================================================
# Deploy Embeddify to EC2
#
# Triggers:
#   - Push to main / master
#   - Manual workflow_dispatch
#
# What it does:
#   1. SSHs into the EC2 instance
#   2. Pulls the latest code from git
#   3. Rebuilds Docker images from source (on the EC2 host)
#   4. Restarts containers via docker compose
#   5. Skips Caddy restart to preserve existing SSL certificates
#
# Secrets required in GitHub repository:
#   EC2_HOST       — Public IP or DNS of your EC2 instance
#   EC2_USERNAME   — SSH user (ubuntu / ec2-user / admin)
#   EC2_SSH_KEY    — Private SSH key (the whole PEM file content)
# =============================================================================
name: Deploy to EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 45  # PyTorch build can take a while

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Deploy via SSH ────────────────────────────────────────────────────
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 900s
          script_stop: true
          script: |
            set -e

            APP_DIR="$HOME/codechest/Embeddify"

            echo "╔═══════════════════════════════════════════════╗"
            echo "║  🚀  CI Deploy — Embeddify                    ║"
            echo "╚═══════════════════════════════════════════════╝"

            # ── Ensure the repo exists as a git clone ────────────────────────
            if [ ! -d "$APP_DIR/.git" ]; then
              echo ""
              echo "[INFO] Repo isn't a git clone — initialising..."
              # Save critical files that might not be in the repo
              BACKUP_DIR=$(mktemp -d)
              for f in "$APP_DIR/backend/.env" "$APP_DIR/.env"; do
                [ -f "$f" ] && cp "$f" "$BACKUP_DIR/"
              done

              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"

              # Restore backed-up files
              for f in "$BACKUP_DIR"/*; do
                [ -f "$f" ] && cp "$f" "$APP_DIR/backend/" 2>/dev/null || true
              done
              rm -rf "$BACKUP_DIR"
              echo "[INFO] Repo initialised. Critical files restored."
            fi

            cd "$APP_DIR"

            echo ""
            echo "[1/3] Pulling latest code..."
            git pull origin main || git pull origin master

            echo ""
            echo "[2/3] Building images & restarting services..."
            echo "      (Caddy restart skipped — SSL certificates preserved)"
            ./deploy.sh --no-caddy

            echo ""
            echo "[3/3] Deployment complete!"
            echo ""
            echo "  Frontend  → https://embeddify.misango.me"
            echo "  Backend   → http://localhost:8000"
            echo "  Docs      → https://embeddify.misango.me/docs"